# Weekly update PRs, opened against dev -- the integration branch -- rather
# than master. Dependabot reads this file from the default branch (master),
# so it takes effect once it lands there.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # The async-stripe crates are pinned to the same exact release
      # candidate and share internal types: bumping one alone breaks the
      # build, so they only ever move together.
      async-stripe:
        patterns:
          - "async-stripe*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
