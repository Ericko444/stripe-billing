[package]
name = "demo"
description = "Demo composition root: the only crate that picks concrete implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api.workspace = true
# Both audit-side crates: audit-pg to run its migrator and to construct the
# PgAuditSink the two standalone-audit write routes use.
audit-pg.workspace = true
domain.workspace = true
# The identity module: `identity_tenant.rs` wraps its session extractor for
# billing. `main` does not mount it yet (Phase 8, Task 14).
identity-api.workspace = true
persistence.workspace = true
service.workspace = true
stripe-adapter.workspace = true
async-trait.workspace = true
axum.workspace = true
dotenvy.workspace = true
jsonwebtoken.workspace = true
secrecy.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# Until `main` mounts the identity module (Phase 8, Task 14), these identity
# crates are needed only by tests: the three-migrators test and the boundary
# proof. `testcontainers` brings up the database both run on.
identity-domain.workspace = true
identity-pg.workspace = true
identity-service.workspace = true
serde_json.workspace = true
testcontainers.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
