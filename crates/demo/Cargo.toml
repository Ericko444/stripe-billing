[package]
name = "demo"
description = "Demo composition root: the only crate that picks concrete implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# Overrides the workspace's `publish = true`: this is the composition root.
# What it does -- pick concrete implementations and own a `main` -- is
# exactly what a consumer does instead of depending on it.
publish = false

[dependencies]
tenantry-api.workspace = true
# Both audit-side crates: audit-pg to run its migrator and to construct the
# PgAuditSink the two standalone-audit write routes use.
tenantry-audit-pg.workspace = true
tenantry-domain.workspace = true
# The identity module: `identity_tenant.rs` wraps its session extractor for
# billing, and `main` mounts its router and wires its adapters.
tenantry-identity-api.workspace = true
tenantry-identity-domain.workspace = true
tenantry-identity-pg.workspace = true
tenantry-identity-service.workspace = true
tenantry-persistence.workspace = true
tenantry-service.workspace = true
tenantry-stripe-adapter.workspace = true
async-trait.workspace = true
axum.workspace = true
dotenvy.workspace = true
secrecy.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tenantry-audit.workspace = true
# Brings up the database the three-migrators test and the boundary proof run on.
serde_json.workspace = true
testcontainers.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
