[package]
name = "tenantry-api"
description = "Axum router factory, wire DTOs and the error-to-HTTP mapping. Exposes a Router, never a binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not inherited from the workspace on purpose: a workspace-level `readme`
# resolves against the workspace root, which would point every crate at the
# repository README instead of its own.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
tenantry-domain.workspace = true
tenantry-service.workspace = true
axum.workspace = true
# Opaque encoding for the invoice pagination cursor. `hex`, not `base64`:
# it is already a workspace dependency (the webhook signatures), and
# the cursor only needs to be opaque, not compact.
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
# Router-level tests capture `tracing` output to assert a `client_secret`
# never reaches a log line. Already a workspace dep.
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
