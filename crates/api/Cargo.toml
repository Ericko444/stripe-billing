[package]
name = "api"
description = "Axum router factory, wire DTOs and the error-to-HTTP mapping. Exposes a Router, never a binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
jwt-auth = ["dep:jsonwebtoken"]

[dependencies]
domain.workspace = true
service.workspace = true
axum.workspace = true
# Opaque encoding for the invoice pagination cursor. `hex`, not `base64`:
# it is already a workspace dependency (Phase 3's webhook signatures), and
# the cursor only needs to be opaque, not compact.
hex.workspace = true
jsonwebtoken = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
