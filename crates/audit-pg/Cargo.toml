[package]
name = "tenantry-audit-pg"
description = "Postgres adapter for the audit crate: its own schema, an append-only table, and an insert usable inside a caller's transaction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not inherited from the workspace on purpose: a workspace-level `readme`
# resolves against the workspace root, which would point every crate at the
# repository README instead of its own.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
tenantry-audit.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

# `persistence` is a dev-only edge, the same reasoning as `stripe-adapter`'s
# own dev-dependency on it: proving the billing module's migrator and this
# crate's migrator coexist against one real Postgres needs the real other
# migrator. It never appears in the production dependency graph.
[dev-dependencies]
# Path-only on purpose, and NOT inherited from the workspace, so it carries no
# version requirement: `cargo publish` strips a dev-dependency that has none.
# That is what breaks the publish-order cycle -- `tenantry-persistence` depends
# on this crate normally, while this crate's own tests depend back on it to
# prove the two migrators share one database. The test needs the cycle; the
# published manifest must not have it.
tenantry-persistence = { path = "../persistence" }
testcontainers.workspace = true
time.workspace = true
tokio.workspace = true

[lints]
workspace = true
