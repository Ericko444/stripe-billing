[package]
name = "tenantry-identity-service"
description = "Identity module use cases, plus the Argon2id, OS-random token and clock implementations of identity-domain's ports. No dependency on the billing module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not inherited from the workspace on purpose: a workspace-level `readme`
# resolves against the workspace root, which would point every crate at the
# repository README instead of its own.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
async-trait.workspace = true
tenantry-audit.workspace = true
getrandom.workspace = true
tenantry-identity-domain.workspace = true
secrecy.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
# `sync` for the semaphore bounding concurrent hashes, `rt` for
# `spawn_blocking`. Named here rather than relied on through feature
# unification: today `sqlx` happens to turn `sync` on for the whole
# workspace, and nothing guarantees it keeps doing so.
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
