[package]
name = "tenantry-audit"
description = "A typed, append-only audit journal, consumable by any module without depending on it. No I/O, no other workspace crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not inherited from the workspace on purpose: a workspace-level `readme`
# resolves against the workspace root, which would point every crate at the
# repository README instead of its own.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[lints]
workspace = true
