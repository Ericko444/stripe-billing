[package]
name = "identity-pg"
description = "Postgres adapter for the identity module: its own schema and migrator, and the repositories implementing identity-domain's ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sqlx.workspace = true
thiserror.workspace = true

# `audit-pg` is a dev-only edge here for now: proving this crate's migrator
# coexists with the audit migrator on one database. It becomes a normal
# dependency when the first repository writes an audit row.
#
# No billing crate appears here, not even as a dev-dependency -- CI's
# "Identity does not depend on billing" check greps this manifest whole.
# The proof that all three migrators share a database lives in `demo`, the
# one crate that already names every module.
[dev-dependencies]
audit-pg.workspace = true
testcontainers.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
