[package]
name = "tenantry-identity-pg"
description = "Postgres adapter for the identity module: its own schema and migrator, and the repositories implementing identity-domain's ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not inherited from the workspace on purpose: a workspace-level `readme`
# resolves against the workspace root, which would point every crate at the
# repository README instead of its own.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
tenantry-audit.workspace = true
# Composes `audit_pg::insert` into this crate's own transactions, so an
# identity write and its audit row commit together.
tenantry-audit-pg.workspace = true
tenantry-identity-domain.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

# No billing crate appears here, not even as a dev-dependency -- CI's
# "Identity does not depend on billing" check greps this manifest whole.
# The proof that all three migrators share a database lives in `demo`, the
# one crate that already names every module.
[dev-dependencies]
hex.workspace = true
secrecy.workspace = true
testcontainers.workspace = true
tokio.workspace = true

[lints]
workspace = true
