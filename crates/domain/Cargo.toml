[package]
name = "tenantry-domain"
description = "Models, value objects, ports (traits) and the error taxonomy. Depends on no I/O crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not inherited from the workspace on purpose: a workspace-level `readme`
# resolves against the workspace root, which would point every crate at the
# repository README instead of its own.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
tenantry-audit.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[lints]
workspace = true
