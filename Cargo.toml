[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
service = { path = "crates/service" }
persistence = { path = "crates/persistence" }
stripe-adapter = { path = "crates/stripe-adapter" }
api = { path = "crates/api" }

# Stripe client, modular line. Pinned exactly: see docs/intent/phase-2.md.
# `default` resolves to default-tls -> hyper-tls -> native-tls, which drags in
# OpenSSL, so default features are off and rustls is named explicitly. Selecting
# rustls without a crypto provider is a compile_error!, so a mistake here is loud.
async-stripe = { version = "=1.0.0-rc.8", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "rustls-ring",
] }
async-stripe-billing = "=1.0.0-rc.8"
async-stripe-client-core = "=1.0.0-rc.8"
async-stripe-core = "=1.0.0-rc.8"
async-trait = "0.1.92"
axum = "0.8.9"
dotenvy = "0.15.7"
jsonwebtoken = "11.0.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "time",
    "json",
    "migrate",
    "derive",
] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }

# Test-only
testcontainers = "0.28.0"
wiremock = "0.6.5"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
missing_docs = "warn"
